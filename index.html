<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grugofy</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
</head>
<body>

<header>
  <div style="position: relative;">
    <button id="btnUploadMenu" class="btn-upload">+</button>
    <div id="uploadMenu" class="dropdown-menu hidden">
      <button id="menuOptionFile">📁 Carica Cartella/File</button>
      <button id="menuOptionYTLink">🔗 Importa Link YouTube</button>
    </div>
  </div>
  <input id="folderInput" type="file" webkitdirectory multiple accept="audio/*,video/*">

  <div class="search-wrapper">
    <input type="text" id="searchInput" placeholder="Cerca brano…" autocomplete="off">
    <button id="clearSearchBtn">✕</button>
  </div>
</header>

<main id="mainContent">

  <section id="queueSection" hidden>
    <div class="section-header">
      <span class="section-title">In Coda</span>
      <div>
        <button id="saveQueueBtn" class="pill-btn">SALVA CODA</button>
        <button id="clearQueueBtn" class="pill-btn pill-btn--danger">SVUOTA</button>
      </div>
    </div>
    <div id="queueList"></div>
  </section>

  <section id="playlistSection">
    <div class="section-header">
      <span class="section-title">Playlist Salvate</span>
      <div>
        <button id="saveHistoryBtn" class="pill-btn">SALVA CRONOLOGIA</button>
        <button id="exportPlaylistsBtn" class="pill-btn pill-btn--blue">ZIP</button>
      </div>
    </div>
    <ul id="playlistsList" style="list-style:none;"></ul>
  </section>

  <span class="section-title">Libreria</span>
  <div id="library">
    <ul id="libraryList" style="list-style:none;"></ul>
  </div>

</main>

<!-- Player bar fissa -->
<div id="playerBar">
  <div id="nowPlayingTitle">Seleziona un brano</div>

  <div class="progress-row">
    <span class="time-label" id="timeCurrent">0:00</span>
    <input type="range" id="seekSlider" value="0" max="100">
    <span class="time-label" id="timeTotal">0:00</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn icon-btn" id="btnShuffle" aria-label="Shuffle"></button>
    <button class="ctrl-btn icon-btn" id="btnPrev"    aria-label="Precedente"></button>
    <button class="ctrl-btn btn-play" id="btnPlay"    aria-label="Play/Pausa"></button>
    <button class="ctrl-btn icon-btn" id="btnNext"    aria-label="Successivo"></button>
    <button class="ctrl-btn icon-btn" id="btnLoop"    aria-label="Loop"></button>
  </div>
</div>

<!-- Elemento audio/video nascosto -->
<video id="mediaEl" playsinline style="display:none"></video>

<!-- Player espanso -->
<div id="expandedPlayer">
  <div id="visualContainer"></div>
  <div id="ytWrapper">
    <div id="ytPlayerEl"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
