<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grugofy</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<header>
  <button id="btnOpenImport" class="btn-upload" aria-label="Aggiungi">+</button>
  <div class="search-wrapper">
    <input type="text" id="searchInput" placeholder="Cerca brano…" autocomplete="off">
    <button id="clearSearchBtn">✕</button>
  </div>
  <button id="btnOpenSettings" class="btn-upload" aria-label="Impostazioni">⚙</button>
</header>

<main id="mainContent">

  <section id="queueSection" hidden>
    <div class="section-header">
      <span class="section-title" id="queueSectionTitle" style="cursor:pointer;user-select:none;">CODA</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="clearQueueBtn"  class="pill-btn pill-btn--danger" aria-label="Svuota coda">✕</button>
        <button id="saveQueueBtn"   class="pill-btn">SALVA CODA</button>
      </div>
    </div>
    <div id="queueList" data-collapsible-body></div>
  </section>

  <section id="playlistSection">
    <div class="section-header">
      <span class="section-title" style="cursor:pointer;user-select:none;">PLAYLIST SALVATE</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="exportAllPlaylistsBtn" class="pill-btn pill-btn--blue" aria-label="Scarica tutte le playlist">
          <!-- Freccia grossa azzurra -->
          <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" style="vertical-align:middle;">
            <path fill="#4fc3f7" d="M10 13L4 7h4V2h4v5h4l-6 6z"/>
            <rect fill="#4fc3f7" x="3" y="15" width="14" height="2" rx="1"/>
          </svg>
        </button>
        <button id="saveHistoryBtn" class="pill-btn">SALVA CRONOLOGIA</button>
      </div>
    </div>
    <div id="playlistList" data-collapsible-body></div>
  </section>

  <span class="section-title" id="libraryTitle" style="cursor:pointer;user-select:none;">LIBRERIA</span>
  <div id="library"></div>

</main>

<!-- Player bar fissa -->
<div id="playerBar">
  <div id="nowPlayingTitle">Seleziona un brano</div>

  <div class="progress-row">
    <span class="time-label" id="timeCurrent">0:00</span>
    <input type="range" id="seekSlider" value="0" max="100">
    <span class="time-label" id="timeTotal">0:00</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn icon-btn" id="btnShuffle" aria-label="Shuffle"></button>
    <button class="ctrl-btn icon-btn" id="btnPrev"    aria-label="Precedente"></button>
    <button class="ctrl-btn btn-play" id="btnPlay"    aria-label="Play/Pausa"></button>
    <button class="ctrl-btn icon-btn" id="btnNext"    aria-label="Successivo"></button>
    <button class="ctrl-btn icon-btn" id="btnLoop"    aria-label="Loop"></button>
  </div>
</div>

<!-- Elemento audio/video nascosto -->
<video id="mediaEl" playsinline style="display:none"></video>

<!-- Player espanso -->
<div id="expandedPlayer">
  <div id="visualContainer"></div>
  <div id="ytWrapper">
    <div id="ytPlayerEl"></div>
    <div id="lyricsLine" class="hidden"></div>
    <div id="ytResizeHandle" aria-label="Ridimensiona player YouTube"></div>
  </div>
</div>

<!-- Input file nascosto, riusato dalla modale import -->
<input id="folderInput" type="file" multiple accept="audio/*,video/*,.txt,text/plain" class="hidden">

<!-- Modale Import -->
<div id="importModal" class="modal hidden">
  <div class="modal-backdrop" id="importModalBackdrop"></div>
  <div class="modal-panel">
    <div class="modal-header">
      <span>Aggiungi musica</span>
      <button id="importModalClose" aria-label="Chiudi">✕</button>
    </div>

    <div class="modal-body">
      <button id="importChooseFilesBtn" class="modal-option">
        📁 File o cartelle dal dispositivo
        <small>Audio, video, o playlist .txt</small>
      </button>

      <div class="modal-divider">oppure</div>

      <label class="modal-label" for="importYtUrl">Una riga per elemento: link YouTube, CSV "Titolo, ytid, durata" o titolo brano</label>
      <textarea id="importYtUrl" rows="4" placeholder="https://www.youtube.com/watch?v=…&#10;https://www.youtube.com/playlist?list=…&#10;Bohemian Rhapsody, dQw4w9WgXcQ, 354&#10;Nome canzone da cercare" autocomplete="off"></textarea>
      <button id="importYtSubmitBtn" class="modal-option modal-option--accent">Importa da YouTube</button>
      <div id="importYtStatus" class="modal-status"></div>
    </div>
  </div>
</div>

<!-- Modale Impostazioni -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-backdrop" id="settingsModalBackdrop"></div>
  <div class="modal-panel">
    <div class="modal-header">
      <span>Impostazioni</span>
      <button id="settingsModalClose" aria-label="Chiudi">✕</button>
    </div>

    <div class="modal-body">
      <div class="settings-row">
        <label for="settingSearchDebounce">Ritardo ricerca durante la digitazione</label>
        <div class="settings-row-control">
          <input type="range" id="settingSearchDebounce" min="100" max="1500" step="50">
          <span id="settingSearchDebounceValue" class="settings-value"></span>
        </div>
      </div>

      <div class="settings-row settings-row--switch">
        <label for="settingProviderYouTube">Provider: YouTube</label>
        <input type="checkbox" id="settingProviderYouTube" class="settings-switch">
      </div>

      <div class="settings-row settings-row--switch">
        <label for="settingPreferOfficialAudio">Privilegia audio ufficiale nelle ricerche automatiche</label>
        <input type="checkbox" id="settingPreferOfficialAudio" class="settings-switch">
      </div>
      <p class="settings-hint">Quando una riga importata è solo testo (nessun link o ID), viene cercata su YouTube: se attivo, tra i primi risultati si preferisce un canale "Topic" o un titolo con "official audio".</p>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
